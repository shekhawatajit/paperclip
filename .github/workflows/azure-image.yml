name: Build image

# Builds the production image on a GitHub runner (no local Docker needed) and stores it in this repository's
# GitHub Container Registry: ghcr.io/<owner>/paperclip, tagged sha-<short> and latest. The Azure Container
# Apps deployment (ajit/azureinfra workloads/llmapps) pulls it from there. The image runs the server in
# Microsoft Entra database mode when DATABASE_AUTH_MODE=azure-entra is set (packages/db/src/azure-entra-auth.ts).
#
# This is the fork's own workflow: the upstream docker.yml only runs for paperclipai/paperclip.
on:
  push:
    branches:
      - "azure-entra-postgres"
  workflow_dispatch:

# Nothing at the workflow level; the job declares the two scopes it uses.
permissions: {}

# A newer push supersedes only the pending run; a build that is already running always finishes.
concurrency:
  group: azure-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      # The Dockerfile's last stage is "cloud", so name the production stage explicitly. The full commit SHA
      # lets a source build include the remote runner provider pack.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
